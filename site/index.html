<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karou Mosaab | Marketing digital</title>
<meta name="description" content="Karou Mosaab - Master 2 Marketing Digital, EHEC. Développement web, automatisation, photographie automobile.">
<style>
  :root{
    --bg:#0b0f1a; --card:#141b2d; --line:#1f2a44;
    --txt:#e8edf7; --muted:#9aa7c4; --acc:#ff7a1a; --acc2:#3ddcff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7}
  a{color:var(--acc2);text-decoration:none}
  img{max-width:100%;display:block}
  /* ---------- NAV ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(11,15,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:1.2rem;color:var(--txt)}
  .logo span{color:var(--acc)}
  .menu{display:flex;gap:6px;flex-wrap:wrap;list-style:none}
  .menu a{color:var(--muted);padding:6px 12px;border-radius:8px;font-size:.92rem}
  .menu a:hover{color:var(--txt);background:var(--card)}
  .lang{display:flex;gap:6px}
  .lang button{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:.85rem}
  .lang button.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
  /* ---------- LAYOUT ---------- */
  section{max-width:1100px;margin:auto;padding:70px 20px;border-bottom:1px solid var(--line)}
  h1{font-size:2.6rem;line-height:1.2;margin-bottom:12px}
  h2{font-size:1.9rem;margin-bottom:18px}
  h2::after{content:"";display:block;width:56px;height:4px;background:var(--acc);border-radius:4px;margin-top:8px}
  h3{font-size:1.15rem;margin-bottom:6px;color:var(--acc2)}
  p{color:var(--muted);margin-bottom:12px}
  .hero{min-height:80vh;display:flex;align-items:center}
  .tag{display:inline-block;background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:.85rem;color:var(--acc);margin-bottom:16px}
  .btn{display:inline-block;margin:8px 10px 0 0;padding:12px 22px;border-radius:10px;font-weight:700;background:var(--acc);color:#111}
  .btn.ghost{background:transparent;border:1px solid var(--acc2);color:var(--acc2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .card .ico{font-size:1.8rem;margin-bottom:8px}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .social{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  .social a{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;color:var(--txt);font-weight:600}
  .social a:hover{border-color:var(--acc)}
  .social svg{width:20px;height:20px;fill:currentColor}
  .counter{margin-top:30px;padding:18px;background:var(--card);border:1px dashed var(--line);border-radius:14px;text-align:center}
  footer{text-align:center;color:var(--muted);padding:30px 20px;font-size:.9rem}
  [dir="rtl"] .menu a{font-family:Tahoma,Arial,sans-serif}
  @media (max-width:640px){h1{font-size:2rem}section{padding:50px 18px}}
</style>
</head>

function setLang(l){
  const d = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = d.dir;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = d[el.dataset.i18n];
    if(v!==undefined) el.textContent = v;
  });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===l));
  try{ localStorage.setItem("km_lang", l); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let saved = null; try{ saved = localStorage.getItem("km_lang"); }catch(e){}
setLang(T[saved] ? saved : "ar");
